name: Tests and build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed CLI and AGENTS.md are up to date
        run: |
          git diff --exit-code --stat bin AGENTS.md || {
            echo "::error::bin/tallyleaf.js or AGENTS.md is out of date. Run 'npm run build:cli' and commit the result."
            exit 1
          }
